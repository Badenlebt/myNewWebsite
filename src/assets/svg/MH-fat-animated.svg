<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="color1">
			<stop stop-color="#02f5f9"/> <!-- #0fd0d6--> <!-- darkturqoise: #00ced1 --> <!-- turqoise: #40e0d0 -->
		</linearGradient>
		<linearGradient id="color1-lin" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#00ced1"/>
			<stop offset="50%" stop-color="#00ced1">
				<animate 
					attributeName="stop-color" 
					from="#00ced1"
					to="#02f5f9"
					dur=".1s" 
					begin="4s"
					repeatCount="1" 
					fill="freeze"
				/>  
			</stop>
			<stop offset="100%" stop-color="#00ced1"/>
		</linearGradient>
		
		<linearGradient id="color2">
			<stop stop-color="#9317e6"/> <!-- #9317e6" --> <!-- darkviolet: #9400d3 --> <!-- indigo: 4b0082 -->
		</linearGradient>
		<linearGradient id="color2-lin" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#4b0082"/>
			<stop offset="50%" stop-color="#4b0082">
				<animate 
					attributeName="stop-color" 
					from="#4b0082"
					to="#9317e6"
					dur=".1s" 
					begin="4s"
					repeatCount="1" 
					fill="freeze"
				/>  
			</stop>
			<stop offset="100%" stop-color="#4b0082"/>
		</linearGradient>
		
		<linearGradient id="color3">
			<stop stop-color="#e6e7e8"/> <!--9317e6"/-->
		</linearGradient>
		<linearGradient id="color3-lin" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#9e9e9e"/>
			<stop offset="0%" stop-color="#9e9e9e">
				<animate 
					attributeName="stop-color" 
					from="#9e9e9e"
					to="#ffffff"
					dur=".01s" 
					begin="1.99s"
					repeatCount="1" 
					fill="freeze"
				/>  
				<animate 
					attributeName="offset" 
					from="0"
					to="1"
					dur="1s" 
					begin="2s"
					repeatCount="1" 
					fill="freeze"
				/> 
				<animate 
					attributeName="stop-color" 
					from="#ffffff"
					to="#9e9e9e"
					dur=".5s" 
					begin="3s"
					repeatCount="1" 
					fill="freeze"
				/> 
				<animate 
					attributeName="offset" 
					from="1"
					to=".5"
					dur=".01s" 
					begin="4s"
					repeatCount="1" 
					fill="freeze"
				/> 
				<animate 
					attributeName="stop-color" 
					from="#9e9e9e"
					to="#ffffff"
					dur=".1s" 
					begin="4s"
					repeatCount="1" 
					fill="freeze"
				/>  
			</stop>
			<stop offset="100%" stop-color="#9e9e9e"/>
		</linearGradient>
		<!--radialGradient id="color3-rad"
            cx="0.5" cy="0.5" r="1" fx="0.66" fy="0.33"
            spreadMethod="pad">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="25%" stop-color="#e6e7e8"/>
			<stop offset="100%" stop-color="#9e9e9e"/>
		</radialGradient-->
	</defs>
	
	<!--rect width="1024" height="1024" fill="#fafafa"/-->
	
	<!-- M -->
	<g stroke-width="100" fill="none" stroke="url(#color1-lin)" >
		<!--circle stroke-width="5" cx="512" cy="512" r="400" /-->
		<path d="M229 795 a400 400 0 0 1 113 -644 l170 170 170 -170 a400 400 0 0 1 113 644" stroke-opacity="0.1">
			<animate attributeType="XML" attributeName="stroke-opacity" from="0.1" to="1" dur="2s"  fill="freeze" begin="0.5s"  />
		</path>
		<!--path d="M512 321 l-170 -170" stroke="black"/-->
	</g>
	
	<!-- O -->
	<g stroke-width="60" fill="none" stroke="url(#color3-lin)">
		<circle stroke-width="15" cx="512" cy="512" r="300" >
			<animate 
				attributeName="r" 
				from="750" 
				to="300" 
				dur="2s"  
				fill="freeze" 
				begin="0s"  
			/>
		</circle>
	</g>
	
	<!-- H -->
	<g stroke-width="100" fill="none" stroke="url(#color2-lin)">
		<!--circle stroke-width="5" cx="512" cy="512" r="200" /-->
		<path d="M371 653 a200 200 0 0 1 0 -282 M312 512 l400 0 M653 371 a200 200 0 0 1 0 282" stroke-opacity="0.1">
			<animate attributeType="XML" attributeName="stroke-opacity" from="0.1" to="1" dur="2s"  fill="freeze" begin="0s"  />
			<animateTransform 
				attributeName="transform" 
				type="translate" 
				dur="2s" 
				values="512,512;0,0" 
				repeatCount="1" 
			/>
			<animateTransform 
				attributeName="transform"
				type="scale"
				additive="sum"
				dur="2s"
				from="0 0"
				to="1 1"
				begin="0s"
				repeatCount="1" 
			/>
		</path>
		<!--rect x="312" y="462" width="400" height="100" fill="url(#color2-lin)" stroke="none" /-->
	</g>
	
</svg>
